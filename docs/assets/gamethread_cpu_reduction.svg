<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#da3633" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea043" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="380" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Title & Subtitle -->
  <text x="40" y="45" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Game Thread CPU Load Reduction (Live Production Server)</text>
  <text x="40" y="70" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">Measured on a 700-hour Endgame Production Save (AMD Ryzen 7 5825U, 8 Cores / 16 Threads)</text>

  <!-- Grid lines -->
  <line x1="220" y1="100" x2="740" y2="100" stroke="#21262d" stroke-width="1" />
  <line x1="220" y1="160" x2="740" y2="160" stroke="#21262d" stroke-width="1" />
  <line x1="220" y1="220" x2="740" y2="220" stroke="#21262d" stroke-width="1" />
  <line x1="220" y1="280" x2="740" y2="280" stroke="#21262d" stroke-width="1" />

  <text x="220" y="300" fill="#6e7681" font-family="monospace" font-size="11">0%</text>
  <text x="350" y="300" fill="#6e7681" font-family="monospace" font-size="11">25%</text>
  <text x="480" y="300" fill="#6e7681" font-family="monospace" font-size="11">50%</text>
  <text x="610" y="300" fill="#6e7681" font-family="monospace" font-size="11">75%</text>
  <text x="735" y="300" fill="#6e7681" font-family="monospace" font-size="11">100%</text>

  <!-- Row 1: Vanilla Baseline -->
  <text x="40" y="142" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Vanilla Synchronous</text>
  <text x="40" y="160" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Core 0 Saturated (103.0%)</text>
  <rect x="220" y="130" width="535" height="34" rx="6" fill="url(#redGrad)" />
  <text x="765" y="152" fill="#f85149" font-family="monospace" font-size="13" font-weight="700">103.0%</text>

  <!-- Row 2: Asynchronous Bridge -->
  <text x="40" y="222" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600">Async Task Bridge</text>
  <text x="40" y="240" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">-79.1% Reduction (21.5%)</text>
  <rect x="220" y="210" width="112" height="34" rx="6" fill="url(#greenGrad)" />
  <text x="342" y="232" fill="#3fb950" font-family="monospace" font-size="13" font-weight="700">21.5%</text>

  <!-- Badge / Stat Highlight Box -->
  <rect x="40" y="325" width="720" height="38" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1" />
  <text x="55" y="349" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">⚡ Result:</text>
  <text x="115" y="349" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Main Game Thread freed from heavy tick computations, leaving </text>
  <text x="475" y="349" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">78.5% CPU headroom</text>
  <text x="605" y="349" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12"> for network RPCs and replication.</text>
</svg>